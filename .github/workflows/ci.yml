# Every check that runs unattended. The one workflow that holds a secret and spends money is
# eval.yml, deliberately kept separate so "which workflow can see the key" is answered by the
# file list rather than by reading job conditions.
name: CI

on:
  pull_request:
  push:
    # Feature branches are covered by their pull request; triggering on both would double
    # every run for no extra signal.
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required check. The fast tier is ~30 test classes against a Testcontainers Postgres, which
  # GitHub-hosted Ubuntu runners provide out of the box.
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # Read at job level so the step below can branch on its presence: `if:` cannot see a
      # secret, but it can see an env var.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarQube Cloud dates "new code" from history; a shallow clone makes every line new.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarQube Cloud analyzers
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Fast tier with coverage
        run: ./mvnw -B -Pcoverage verify

      - name: SonarQube Cloud
        # Absent on pull requests from forks, which receive no secrets by design. Skipping keeps
        # such a PR green on the checks it can run rather than red on a token it cannot have.
        if: env.SONAR_TOKEN != ''
        # scanAll makes the scanner index the frontend as well as the Java source roots — the
        # TS/TSX half is the larger one. It must be a command-line -D: as a pom property it is
        # ignored without warning. Note it is disabled outright if sonar.sources is overridden,
        # so the two are alternatives and the pom deliberately sets neither.
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.maven.scanAll=true

  # Advisory until it has a run history: a Playwright browser download is a network dependency,
  # and a required check that flakes is worse than no required check.
  pdf:
    name: pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # Playwright pins its browser build to the library version, so the pom is the key.
          key: ${{ runner.os }}-playwright-${{ hashFiles('pom.xml') }}
          restore-keys: ${{ runner.os }}-playwright-

      - name: PDF tier
        run: ./mvnw -B -Ppdf test

  # Required check. `-Pfrontend package` already runs `tsc -b`, so the genuine gap this closes is
  # oxlint, which nothing else runs — and a red X here names the frontend instead of surfacing as
  # a Maven stack trace.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches node.version in pom.xml, so CI and `-Pfrontend` agree.
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b

  # Assembly check only, and only on main: proves `-Pfrontend` still produces a jar with the SPA
  # inside. Tests are skipped because `build` just ran them.
  package:
    name: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # No setup-node here on purpose: the frontend profile installs its own pinned Node into
      # frontend/.mvn-node, which is the point of pinning it there.
      - name: Package with the SPA inside
        run: ./mvnw -B -Pfrontend clean package -DskipTests

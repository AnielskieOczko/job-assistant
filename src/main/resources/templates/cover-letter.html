<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${langCode}" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${letter.fullName} + ' — Cover letter'">Cover letter</title>
    <style>
        :root { --ink: #16191d; --muted: #5b6672; --accent: #1f5f8b; }

        @page { size: A4; margin: 20mm 18mm; }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Inter", "Helvetica Neue", "Segoe UI", Roboto, "DejaVu Sans", Arial, sans-serif;
            font-size: 10.8pt;
            line-height: 1.6;
            color: var(--ink);
            background: #fff;
        }

        header { border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 24px; }
        h1 { margin: 0 0 4px; font-size: 17pt; font-weight: 650; letter-spacing: -0.015em; }
        .contacts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 9pt; color: var(--muted); }
        .contacts a { color: inherit; text-decoration: none; }
        .addressee { margin-bottom: 20px; color: var(--muted); font-size: 10pt; }
        p.body-text { margin: 0 0 12px; }
        .sign-off { margin-top: 22px; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${letter.fullName}">Name</h1>
    <div class="contacts">
        <span th:each="contact : ${letter.contacts}" th:text="${contact}">contact</span>
        <a th:each="link : ${letter.links}" th:href="${link.url}" th:text="${link.label}">link</a>
    </div>
</header>

<div class="addressee" th:if="${letter.roleLine}" th:text="${letter.roleLine}">Re: Role at Company</div>

<p class="body-text" th:each="paragraph : ${letter.paragraphs}" th:text="${paragraph}">Paragraph</p>

<div class="sign-off" th:text="${letter.fullName}">Name</div>
</body>
</html>

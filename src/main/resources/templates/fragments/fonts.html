  PDF whatever font it resolved *at render time*, so a family name in a font stack means the
  document depends on what the rendering machine happens to have installed. And
  PlaywrightDocumentRenderer calls page.setContent(html) with no base URL, so a relative url() in

  CV rendered without it falls back mid-word on Poznan, Gdansk or Wroclaw. Issue #14 found this
  the hard way; see docs/adr or the issue for the rendered evidence.

  One fragment rather than a copy per template, because 149 KB duplicated is 149 KB to forget to
  update. CvInvariant is unaffected by the size: it scans HtmlText.visibleText, which never sees
  the inside of a <style> element.
*/-->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${langCode}" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${cv.fullName} + ' — CV'">CV</title>
    <style>
        /* Chromium renders this, so modern CSS is available. Single-column body keeps it
           parseable by applicant tracking systems. */
        :root {
            --ink: #16191d;
            --muted: #5b6672;
            --rule: #dfe4ea;
            --accent: #1f5f8b;
            --chip: #eef3f7;
        }

        @page {
            size: A4;
            margin: 14mm 14mm 16mm;
        }

        * { box-sizing: border-box; }

        html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

        body {
            margin: 0;
            font-family: "Inter", "Helvetica Neue", "Segoe UI", Roboto, "DejaVu Sans", Arial, sans-serif;
            font-size: 10.2pt;
            line-height: 1.45;
            color: var(--ink);
            background: #fff;
        }

        header { border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-bottom: 16px; }

        h1 {
            margin: 0 0 2px;
            font-size: 21pt;
            font-weight: 650;
            letter-spacing: -0.015em;
        }

        .headline { margin: 0 0 8px; color: var(--accent); font-size: 11pt; font-weight: 550; }

        .contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            font-size: 9pt;
            color: var(--muted);
        }

        .contacts a { color: inherit; text-decoration: none; }

        .summary { margin: 0 0 18px; font-size: 10.4pt; }

        section { margin-bottom: 16px; }

        h2 {
            margin: 0 0 8px;
            font-size: 8.6pt;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .skills { display: flex; flex-wrap: wrap; gap: 5px; }

        .chip {
            background: var(--chip);
            border-radius: 3px;
            padding: 2.5px 7px;
            font-size: 9pt;
            white-space: nowrap;
        }

        .role { margin-bottom: 12px; break-inside: avoid; }

        .role-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
        }

        .role-title { font-weight: 620; }
        .role-company { color: var(--accent); }
        .role-period { color: var(--muted); font-size: 9pt; white-space: nowrap; }

        ul { margin: 5px 0 0; padding-left: 16px; }
        li { margin-bottom: 3px; }

        .education-item { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
        .education-item .muted { color: var(--muted); font-size: 9pt; white-space: nowrap; }

        .languages { display: flex; flex-wrap: wrap; gap: 4px 16px; }
    </style>
</head>
<body>
<header>
    <h1 th:text="${cv.fullName}">Name</h1>
    <p class="headline" th:if="${cv.headline}" th:text="${cv.headline}">Headline</p>
    <div class="contacts">
        <span th:each="contact : ${cv.contacts}" th:text="${contact}">contact</span>
        <a th:each="link : ${cv.links}" th:href="${link.url}" th:text="${link.label}">link</a>
    </div>
</header>

<p class="summary" th:if="${cv.summaryLine}" th:text="${cv.summaryLine}">Summary</p>

<section th:if="${!cv.skills.isEmpty()}">
    <h2>Skills</h2>
    <div class="skills">
        <span class="chip" th:each="skill : ${cv.skills}" th:text="${skill}">skill</span>
    </div>
</section>

<section th:if="${!cv.experiences.isEmpty()}">
    <h2>Experience</h2>
    <div class="role" th:each="role : ${cv.experiences}">
        <div class="role-head">
            <div>
                <span class="role-title" th:text="${role.roleTitle}">Role</span>
                <span> · </span>
                <span class="role-company" th:text="${role.company}">Company</span>
            </div>
            <span class="role-period" th:text="${role.period}">2021 — present</span>
        </div>
        <ul th:if="${!role.bullets.isEmpty()}">
            <li th:each="bullet : ${role.bullets}" th:text="${bullet}">bullet</li>
        </ul>
    </div>
</section>

<section th:if="${!cv.education.isEmpty()}">
    <h2>Education</h2>
    <div class="education-item" th:each="item : ${cv.education}">
        <span th:text="${item.summary}">Degree</span>
        <span class="muted" th:text="${item.period}">2014 — 2018</span>
    </div>
</section>

<section th:if="${!cv.credentials.isEmpty()}">
    <h2>Credentials</h2>
    <div class="education-item" th:each="item : ${cv.credentials}">
        <span th:text="${item.title + ' — ' + item.issuer}">Title — Issuer</span>
        <span class="muted" th:text="${item.period}">Issued Jan 2024</span>
    </div>
</section>

<section th:if="${!cv.languages.isEmpty()}">
    <h2>Languages</h2>
    <div class="languages">
        <span th:each="language : ${cv.languages}" th:text="${language}">English (C1)</span>
    </div>
</section>
</body>
</html>

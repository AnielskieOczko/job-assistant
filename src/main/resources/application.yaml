spring:
  application:
    name: job-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobassistant}
    username: ${DB_USER:jobassistant}
    password: ${DB_PASSWORD:jobassistant}
    hikari:
      # Neon scales compute to zero after 5 min idle, so keep the pool small and
      # tolerant of a cold start on the first request.
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  # Decision 12: single-user MVP, bound to loopback only.
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.jankowski.rafal.jobassistant: DEBUG

job-assistant:
  llm:
    # Named model profiles. All three endpoints are OpenAI-compatible, so switching
    # provider is base-url + key only (decision 6).
    #
    # log-requests / log-responses are stated explicitly on every profile even though false is
    # already the default. They dump whole prompt and response bodies to the console, and there is
    # no logback config filtering anything, so turning one on would spill profile data into the
    # logs. Written out so enabling it is a visible diff rather than an invisible default flip.
    profiles:
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key: ${OPENROUTER_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        # Off deliberately, and this is a hypothesis under test rather than a settled choice.
        #
        # Three consecutive eval runs on 2026-08-27 showed minimax/minimax-m3 producing degenerate
        # structured output: null response content (which crashed the call until #24), zero claimed
        # bullets on three of five tailoring fixtures, response-mode identifiers arriving as skill
        # names ("json-only", "json-only-response", "general_assistant"), and 03-polish-java-offer
        # swinging from recall 1.00 to 0.00 between two runs twenty minutes apart.
        #
        # That pattern is what a provider that does not really honour strict JSON-schema mode looks
        # like - the same reason the `local` profile below has always had this off. Setting it false
        # stops AiServices declaring RESPONSE_FORMAT_JSON_SCHEMA, so JSON is asked for in prose and
        # JsonOutputGuardrail repairs what comes back.
        #
        # Compare the next eval scorecard against target/eval-report.md from run 33125173396. If the
        # numbers recover, the flag was wrong; if they do not, the model is, and `tasks` below can
        # point EXTRACTION and DOCUMENT at a different profile with no code change.
        strict-schema: false
        timeout: PT120S
        log-requests: false
        log-responses: false
      requesty:
        base-url: https://router.requesty.ai/v1
        api-key: ${REQUESTY_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        strict-schema: true
        timeout: PT120S
        log-requests: false
        log-responses: false
      local:
        base-url: http://localhost:11434/v1
        api-key: ollama
        model: qwen3:8b
        temperature: 0.2
        # Small local models rarely honour strict JSON schema; rely on parse-repair.
        strict-schema: false
        timeout: PT300S
        log-requests: false
        log-responses: false
    audit:
      # How long a copy of a prompt is kept in llm_call. Even with identifiers kept out of prompts,
      # what remains describes who worked where. PT0S keeps rows forever.
      retention: P30D
    # Which profile serves which task (decision 22: all remote by default).
    tasks:
      extraction: openrouter
      narrative: openrouter
      document: openrouter

spring:
  application:
    name: job-assistant
  profiles:
    # Which database this process writes to lives in application-dev.yaml / application-prod.yaml,
    # and nothing here supplies a fallback. Defaulting to dev is what makes a bare
    # `./mvnw spring-boot:run` incapable of reaching the production data: reaching it takes an
    # explicit SPRING_PROFILES_ACTIVE=prod. See docs/operations.md.
    default: dev
  datasource:
    hikari:
      # Neon scales compute to zero after 5 min idle, so keep the pool small and
      # tolerant of a cold start on the first request.
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Both are already the Flyway 10 defaults. Written out for the same reason every llm profile
    # states log-requests: false - there is now a database whose loss is not recoverable from the
    # repository, so turning either off should be a visible diff rather than an invisible default.
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      # The one upload this application accepts is a profile portrait, rendered at 23 x 28 mm.
      # Bounded here so the container refuses an oversized file while it is still arriving, rather
      # than buffering all of it and then having the handler reject it.
      max-file-size: 2MB
      max-request-size: 2MB
  threads:
    virtual:
      enabled: true

server:
  # Decision 12: single-user MVP, bound to loopback only. The port is per-environment so dev and
  # prod can run side by side; see application-dev.yaml / application-prod.yaml.
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

job-assistant:
  market:
    # The ingested market corpus behind the offer market dashboard. Structured salary, skills and
    # experience level arrive as data, so ingestion involves no model and cannot hallucinate.
    #
    # enabled gates the scheduled poll only - POST /api/market/ingest works either way. It is set
    # per environment (on in prod, off in dev: the corpus belongs to prod and one poll from a dev
    # run would spend someone else's capacity to fill a database nobody reads). No value here on
    # purpose - MarketIngestionScheduler is @ConditionalOnProperty(matchIfMissing = true), so a
    # profile that forgets it polls, and the profiles are where that must be visible.
    # Daily. The whole IT division is three requests against a published 300/minute limit, and the
    # source caches hourly, so polling harder would buy nothing and spend someone else's capacity.
    cron: "0 20 4 * * *"
    # Which slice of the corpus counts as "this job hunt". The whole IT division is ingested and is
    # thick with QA, BA and PM roles, so demand is measured among offers that also ask for one of
    # these rather than across a market this candidate is not applying to.
    #
    # Canonical catalog names. One that does not resolve is logged and ignored, never guessed at.
    scope:
      skills:
        - Java
        - Kotlin
        - Spring
        - Spring Boot
    solid-jobs:
      base-url: https://solid.jobs
      # The API is keyless; its docs ask callers to identify themselves with a campaign parameter
      # and its FAQ invites integrations. Sending it is the cost of being a welcome client.
      campaign: job-assistant
      divisions:
        - IT
      page-size: 500
      max-pages: 20
      timeout: PT60S

  llm:
    # Named model profiles. All three endpoints are OpenAI-compatible, so switching
    # provider is base-url + key only (decision 6).
    #
    # log-requests / log-responses are stated explicitly on every profile even though false is
    # already the default. They dump whole prompt and response bodies to the console, and there is
    # no logback config filtering anything, so turning one on would spill profile data into the
    # logs. Written out so enabling it is a visible diff rather than an invisible default flip.
    profiles:
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key: ${OPENROUTER_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        strict-schema: true
        timeout: PT120S
        log-requests: false
        log-responses: false
        # OpenRouter serves one model slug from many upstream providers, and only some of them
        # implement structured outputs - for minimax/minimax-m3 it was 3 of 11 in August 2026,
        # the first-party Minimax endpoint among those that do not. Without this, response_format
        # is only a soft preference: the request routes to a provider that cannot honour the JSON
        # schema and that provider silently ignores it, which is what produced empty tailorings,
        # response-mode identifiers arriving as skill names, and the same fixture scoring 1.00 and
        # then 0.00 on identical configuration.
        #
        # require_parameters restricts routing to providers supporting every parameter sent, so
        # strict-schema: true above actually means something. Add `only: [CoreWeave, Parasail]`
        # here to pin harder; the cost is availability, since a pinned provider being down becomes
        # a failed call rather than a silently degraded one.
        custom-parameters:
          provider:
            require_parameters: true
      requesty:
        base-url: https://router.requesty.ai/v1
        api-key: ${REQUESTY_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        strict-schema: true
        timeout: PT120S
        log-requests: false
        log-responses: false
      local:
        base-url: http://localhost:11434/v1
        api-key: ollama
        model: qwen3:8b
        temperature: 0.2
        # Small local models rarely honour strict JSON schema; rely on parse-repair.
        strict-schema: false
        timeout: PT300S
        log-requests: false
        log-responses: false
    audit:
      # How long a copy of a prompt is kept in llm_call. Even with identifiers kept out of prompts,
      # what remains describes who worked where. PT0S keeps rows forever.
      #
      # This does NOT age out the spend totals: llm_spend_daily is written alongside each audit row
      # and is never purged, which is the whole reason it exists as a separate table.
      retention: P30D
    budget:
      # Hard caps on model spend, in the provider's billing unit. Both unset, which means no cap.
      #
      # Deliberately not given a default: a limit guessed on the reader's behalf would refuse work
      # for a reason nobody chose. Set one and a call is refused - not warned about - once the
      # running total for the period reaches it, before anything is sent. Periods are UTC days and
      # UTC calendar months, matching llm_spend_daily and the providers' own dashboards.
      #
      # daily-usd: 0.50
      # monthly-usd: 10.00
    account:
      # How long the provider's own spend figure is reused before being fetched again. It moves in
      # cents per day while the dashboard refreshes every thirty seconds, so this is the difference
      # between one outbound request against a billing endpoint and hundreds. PT0S fetches always.
      cache-ttl: PT5M
    # Which profile serves which task (decision 22: all remote by default).
    tasks:
      extraction: openrouter
      narrative: openrouter
      document: openrouter
      # Added together with LlmTask.TRIAGE: a task pointing at no profile fails loudly at first
      # use, so the enum and this map are never allowed to drift apart.
      triage: openrouter

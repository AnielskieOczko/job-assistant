spring:
  application:
    name: job-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobassistant}
    username: ${DB_USER:jobassistant}
    password: ${DB_PASSWORD:jobassistant}
    hikari:
      # Neon scales compute to zero after 5 min idle, so keep the pool small and
      # tolerant of a cold start on the first request.
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 30000
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

server:
  # Decision 12: single-user MVP, bound to loopback only.
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.jankowski.rafal.jobassistant: DEBUG

job-assistant:
  llm:
    # Named model profiles. All three endpoints are OpenAI-compatible, so switching
    # provider is base-url + key only (decision 6).
    #
    # log-requests / log-responses are stated explicitly on every profile even though false is
    # already the default. They dump whole prompt and response bodies to the console, and there is
    # no logback config filtering anything, so turning one on would spill profile data into the
    # logs. Written out so enabling it is a visible diff rather than an invisible default flip.
    profiles:
      openrouter:
        base-url: https://openrouter.ai/api/v1
        api-key: ${OPENROUTER_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        strict-schema: true
        timeout: PT120S
        log-requests: false
        log-responses: false
        # OpenRouter serves one model slug from many upstream providers, and only some of them
        # implement structured outputs - for minimax/minimax-m3 it was 3 of 11 in August 2026,
        # the first-party Minimax endpoint among those that do not. Without this, response_format
        # is only a soft preference: the request routes to a provider that cannot honour the JSON
        # schema and that provider silently ignores it, which is what produced empty tailorings,
        # response-mode identifiers arriving as skill names, and the same fixture scoring 1.00 and
        # then 0.00 on identical configuration.
        #
        # require_parameters restricts routing to providers supporting every parameter sent, so
        # strict-schema: true above actually means something. Add `only: [CoreWeave, Parasail]`
        # here to pin harder; the cost is availability, since a pinned provider being down becomes
        # a failed call rather than a silently degraded one.
        custom-parameters:
          provider:
            require_parameters: true
      requesty:
        base-url: https://router.requesty.ai/v1
        api-key: ${REQUESTY_API_KEY:}
        model: minimax/minimax-m3
        temperature: 0.2
        strict-schema: true
        timeout: PT120S
        log-requests: false
        log-responses: false
      local:
        base-url: http://localhost:11434/v1
        api-key: ollama
        model: qwen3:8b
        temperature: 0.2
        # Small local models rarely honour strict JSON schema; rely on parse-repair.
        strict-schema: false
        timeout: PT300S
        log-requests: false
        log-responses: false
    audit:
      # How long a copy of a prompt is kept in llm_call. Even with identifiers kept out of prompts,
      # what remains describes who worked where. PT0S keeps rows forever.
      retention: P30D
    # Which profile serves which task (decision 22: all remote by default).
    tasks:
      extraction: openrouter
      narrative: openrouter
      document: openrouter
